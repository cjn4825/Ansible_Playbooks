---
- name: Check if FreeIPA is already configured
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  register: ipa_config

- name: Skip remaining tasks if FreeIPA is installed
  block:
    - name: Print message
      ansible.builtin.debug:
        msg: "FreeIPA is already installed. Skipping remaining tasks."

    - name: End playbook for this host
      ansible.builtin.meta: end_host
  when: ipa_config.stat.exists

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PermitRootLogin\s+'
    line: 'PermitRootLogin no'
    state: present
    validate: 'sshd -t -f %s'
  notify: Restart sshd

- name: Disable password-based SSH authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PasswordAuthentication\s+'
    line: 'PasswordAuthentication no'
    state: present
    validate: 'sshd -t -f %s'
  notify: Restart sshd

- name: Ensure public key authentication is enabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PubkeyAuthentication\s+'
    line: 'PubkeyAuthentication yes'
    state: present
    validate: 'sshd -t -f %s'
  notify: Restart sshd

- name: Enable and start qemu-guest-agent service
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Mapping FQDN in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "10.10.20.5 ipa.home.lab ipa"
    insertbefore: BOF
    state: present

- name: Install packages
  ansible.builtin.dnf:
    name:
      - freeipa-server
      - freeipa-server-dns
      - firewalld
      - python3-firewall
    state: present
    update_cache: true

- name: Run unattended FreeIPA server installation
  command: >
    ipa-server-install --unattended
    --realm={{ ipa_realm }}
    --domain={{ ipa_domain }}
    --ds-password={{ ipa_ds_password }}
    --admin-password={{ ipa_admin_password }}
    --setup-dns
    --auto-forwarders

- name: Define custom BIND ACLs in ipa-ext.conf
  copy:
    src: ipa-ext.conf
    dest: /etc/named/ipa-ext.conf
    owner: root
    group: named
    mode: '0640'

- name: Configure query and recursion restrictions in ipa-options-ext.conf
  copy:
    src: ipa-options-ext.conf
    dest: /etc/named/ipa-options-ext.conf
    owner: root
    group: named
    mode: '0640'

- name: Ensure BIND DNS service is restarted to apply extension configs
  ansible.builtin.systemd:
    name: named
    state: restarted

- name: Allow subnets to query chrony
  ansible.builtin.lineinfile:
    path: /etc/chrony.conf
    line: "allow 10.10.0.0/16"
    state: present

- name: Restart chronyd service
  ansible.builtin.systemd:
    name: chronyd
    state: restarted

- name: Ensure firewalld service is started and enabled
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Ensure firewalld allows FreeIPA and DNS services
  ansible.builtin.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - http
    - https
    - dns
    - ntp
    - kerberos
    - kpasswd
    - ldap
    - ldaps
    - freeipa-4

- name: Create Infrastructure Admin Group
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "infra-admins"
    description: "Infrastructure administrators group"
    state: present

- name: Create Infrastructure Admin User
  freeipa.ansible_freeipa.ipauser:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "infra_admin"
    first: "Infra"
    last: "Admin"
    password: "{{ infra_admin_pass }}"
    sshpubkey:
      - "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
    state: present

- name: Add infra_admin to infra-admins group
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "infra-admins"
    user:
      - "infra_admin"
    action: member
    state: present

- name: Create Music Server Admin Group
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "music-admins"
    description: "Music Server administrators group"
    state: present

- name: Create Music Server Admin User
  freeipa.ansible_freeipa.ipauser:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "music_admin"
    first: "Music"
    last: "Admin"
    password: "{{ music_admin_pass }}"
    state: present

- name: Add music_admin to music-admins group
  freeipa.ansible_freeipa.ipagroup:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "music-admins"
    user:
      - "music_admin"
    action: member
    state: present

- name: Restrict default allow_all HBAC rule to administrative groups only
  freeipa.ansible_freeipa.ipahbacrule:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "allow_all"
    group:
      - "admins"
      - "infra-admins"
    usercategory: ""
    state: present

- name: Create HBAC rule allowing infra-admins to access all infra hosts
  freeipa.ansible_freeipa.ipahbacrule:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "access-infra-admins-all"
    description: "Allow infra-admins group access to all cluster nodes"
    group:
      - "infra-admins"
    hostcategory: "all"
    servicecategory: "all"
    state: present

