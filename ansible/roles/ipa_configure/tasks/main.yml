- name: Create global sudo rule allowing infra-admins full root access
  freeipa.ansible_freeipa.ipasudorule:
    ipaadmin_password: "{{ ipa_admin_password }}"
    name: "sudo-infra-admins-all"
    description: "Grant full sudo privileges to infra-admins across all hosts"
    group:
      - "infra-admins"
    hostcategory: "all"
    cmdcategory: "all"
    runasusercategory: "all"
    state: present

